name: Bot XML Transportadoras

on:
  # Disparado pelo cron-job.org (ou manualmente aqui no GitHub)
  workflow_dispatch:
    inputs:
      transportadora:
        description: 'Qual transportadora rodar?'
        required: true
        default: 'JAMEF'
        type: choice
        options:
          - JAMEF
          - FITLOG TRANSPORTES
          - MIRA TRANSPORTES
          - RODONAVES
          - JAMEF + RODONAVES (ao mesmo tempo)
      reprocessar:
        description: 'Ignorar o histórico e reprocessar os pedidos Ready To Ship (só vale para JAMEF)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      transportadoras: ${{ steps.lista.outputs.transportadoras }}
    steps:
      # "JAMEF + RODONAVES" vira dois jobs em paralelo, cada um com seu acesso
      # ao OMS. As demais opções seguem uma por disparo, como sempre foi.
      - id: lista
        env:
          ESCOLHA: ${{ github.event.inputs.transportadora }}
        run: |
          if [ "$ESCOLHA" = "JAMEF + RODONAVES (ao mesmo tempo)" ]; then
            echo 'transportadoras=["JAMEF","RODONAVES"]' >> "$GITHUB_OUTPUT"
          else
            echo "transportadoras=[\"$ESCOLHA\"]" >> "$GITHUB_OUTPUT"
          fi

  rodar-bot:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Um job não derruba o outro: se a JAMEF falhar, a Rodonaves segue.
      fail-fast: false
      matrix:
        transportadora: ${{ fromJson(needs.preparar.outputs.transportadoras) }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        # reportlab e requests: etiqueta e API da Rodonaves (rte_etiqueta.py)
        run: pip install -r requirements.txt reportlab requests

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            libasound2t64 libgbm1 libnss3 libxss1 libxtst6 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libpango-1.0-0 libcairo2

      - name: Instalar Chromium (Playwright)
        run: python -m playwright install chromium

      - name: Rodar o bot
        env:
          SISTEMA_EMAIL: ${{ secrets.SISTEMA_EMAIL }}
          SISTEMA_SENHA: ${{ secrets.SISTEMA_SENHA }}
          TRANSPORTADORA: ${{ matrix.transportadora }}
          REPROCESSAR: ${{ github.event.inputs.reprocessar }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JAMEF_API_USUARIO: ${{ secrets.JAMEF_API_USUARIO }}
          JAMEF_API_SENHA: ${{ secrets.JAMEF_API_SENHA }}
          PLATINUM_EMAIL: ${{ secrets.PLATINUM_EMAIL }}
          PLATINUM_SENHA: ${{ secrets.PLATINUM_SENHA }}
          # Acesso separado do OMS para a Rodonaves: é o que permite ela subir
          # etiqueta ao mesmo tempo que a JAMEF, sem disputar a mesma sessão.
          PLATINUM_EMAIL_RODONAVES: ${{ secrets.PLATINUM_EMAIL_RODONAVES }}
          PLATINUM_SENHA_RODONAVES: ${{ secrets.PLATINUM_SENHA_RODONAVES }}
          # Rodonaves (RTE): acesso à API da malha
          RTE_USER: ${{ secrets.RTE_USER }}
          RTE_PASS: ${{ secrets.RTE_PASS }}
          # Envio do NOTFIS para a RTE: crie a variável RTE_ENVIAR_NOTFIS=false em
          # Settings > Secrets and variables > Actions > Variables para desligar (padrão: envia)
          RTE_ENVIAR_NOTFIS: ${{ vars.RTE_ENVIAR_NOTFIS || 'true' }}
          HEADLESS: "false"
          CI: "true"
        # Tela virtual: o Chrome roda "visível" (Zecore e Platinum)
        run: xvfb-run -a python bot.py

      - name: Salvar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Precisa ser único por job da matriz, senão o upload falha com nome repetido.
          name: logs-${{ github.run_id }}-${{ matrix.transportadora }}
          path: logs/
          retention-days: 7

      - name: Commitar histórico atualizado
        if: always()
        env:
          TRANSPORTADORA: ${{ matrix.transportadora }}
        run: |
          git config --local user.email "bot@zebrands.mx"
          git config --local user.name "Bot XML Transportadoras"
          git add historico_processados.json
          if git diff --staged --quiet; then
            echo "Nada novo no histórico."
            exit 0
          fi
          git commit -m "🤖 Histórico atualizado ($TRANSPORTADORA)"
          # O checkout é do começo do job e este passo roda ~17 min depois. Se
          # outro commit entrou na main nesse intervalo, o push era recusado e
          # TODO o trabalho do bot ia embora.
          for tentativa in 1 2 3 4 5; do
            if git push; then
              echo "Histórico publicado (tentativa $tentativa)."
              exit 0
            fi
            echo "Push recusado — juntando com a main e tentando de novo ($tentativa/5)."
            git fetch origin main
            # JAMEF e Rodonaves rodam em paralelo e escrevem o mesmo arquivo.
            # A resposta certa aqui é a UNIÃO das duas listas: escolher um lado
            # apagaria os pedidos que o outro job acabou de processar.
            git show FETCH_HEAD:historico_processados.json > /tmp/remoto.json 2>/dev/null || echo '{"docnames_processados":[]}' > /tmp/remoto.json
            jq -s '{ultima_execucao: (.[0].ultima_execucao // .[1].ultima_execucao), docnames_processados: (((.[0].docnames_processados // []) + (.[1].docnames_processados // [])) | unique)}' historico_processados.json /tmp/remoto.json > /tmp/juntado.json
            git reset --hard FETCH_HEAD
            mv /tmp/juntado.json historico_processados.json
            git add historico_processados.json
            if git diff --staged --quiet; then
              echo "A main já tinha tudo o que este job processou."
              exit 0
            fi
            git commit -m "🤖 Histórico atualizado ($TRANSPORTADORA)"
            sleep $((tentativa * 3))
          done
          echo "Não consegui publicar o histórico depois de 5 tentativas."
          exit 1
